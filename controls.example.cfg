# c1x key bindings (example)
#
# The launcher (c1x_launcher.exe) creates controls.cfg from this file and
# changes it in its Controls tab. controls.cfg is ignored by git, so your
# layout stays local. Without a controls.cfg the game uses the bindings
# below, which are built into the game: WASD to move, Space to jump,
# K to spin.
#
# Each line binds a PlayStation button to a keyboard key:
#
#   button = key name
#
# Buttons: cross, square, circle, triangle, l1, r1, l2, r2, l3, r3,
#          up, down, left, right, start, select
#
# Key names are SDL scancode names, e.g. Z, Space, Return, Left Shift,
# Left Ctrl, Keypad 8, F1. The full list is at
# https://wiki.libsdl.org/SDL2/SDL_Scancode (use the names, not the
# SDL_SCANCODE_ constants). Names are not case-sensitive.
#
# Keys are matched by their position on the keyboard, so on a non-QWERTY
# layout "Z" means the key where Z is on a US keyboard.
#
# To give a button more than one key, repeat its line. A button left out of
# this file keeps its default keys. Lines starting with # are ignored.
#
# A line can bind a game controller button instead, with "pad:" and SDL's
# name for it, e.g. "cross = pad:a" or "r2 = pad:righttrigger". Names:
# a, b, x, y (bottom, right, left, top), back, guide, start, leftstick,
# rightstick, leftshoulder, rightshoulder, lefttrigger, righttrigger,
# dpup, dpdown, dpleft, dpright. A button's pad lines replace only its
# default controller button, and its key lines only its default key. By
# default the controller is laid out like a PlayStation pad (a is cross,
# back is select), and the left stick always moves like the d-pad.
#
# With two players, "p2 " in front of a button binds player two's key, e.g.
# "p2 cross = Keypad 0". Player two's keys are the arrows to move and the
# number pad's 0, 4, 6 and 8 for the face buttons, so two people can share
# one keyboard. Both players' controllers use the pad lines: the first
# controller plugged in is player one's, the second player two's.
#
# Changes take effect the next time the game starts.

cross    = Space
square   = K
circle   = ;
triangle = O

l1 = Q
r1 = P
l2 = E
r2 = I
l3 = R
r3 = U

up    = W
down  = S
left  = A
right = D

start  = J
select = F

p2 cross    = Keypad 0
p2 square   = Keypad 4
p2 circle   = Keypad 6
p2 triangle = Keypad 8

p2 up    = Up
p2 down  = Down
p2 left  = Left
p2 right = Right
