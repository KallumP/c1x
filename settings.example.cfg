# c1 settings (example)
#
# The launcher (build/_launcher.exe) creates settings.cfg from this file and
# changes it in its Settings tab. The values below are the defaults. See doc/settings.md for what each
# setting does and the values it takes.

# general
fullscreen = off
fps_display = on
frame_rate = 60
mute = off

# game adjustments
box_display = on
skip_splash_screens = on
skip_loading_screen = off
loading_screen_min_ms = 1000
fix_model_draw_order = on
spin_ledge_jump = on
speed_display = off
spin_display = off

# co-op: a second crash plays beside the first, and each player's colours,
# as six hex digits (red, green, blue). player 1's here are crash's own
two_players = off
p1_fur_color = ff3100
p1_shorts_color = 002790
p1_shoes_color = 330000
p1_belly_color = ff7600
p1_hair_color = 9d0000
p2_fur_color = 33333a
p2_shorts_color = 7a3e9d
p2_shoes_color = 2d2d2d
p2_belly_color = f0f0f0
p2_hair_color = f0f0f0

# saving: the game's own save and load screens, saving to files in memory_card/
memory_card = off

# replays
replay_inputs = off
replay_speed = 1

# the level, built to build/levels/, that CUSTOM LEVEL on the title screen starts (see doc/custom_levels.md):
# boot_level = 1_tide_ruins
