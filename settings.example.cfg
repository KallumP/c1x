# c1 settings (example)
#
# The launcher (build/_launcher.exe) creates settings.cfg from this file and
# changes it in its Settings tab. The values below are the defaults. See doc/settings.md for what each
# setting does and the values it takes.

# general
fullscreen = off
fps_display = on
frame_rate = 60
ps1_speed = on
mute = off

# game adjustments
box_display = on
skip_splash_screens = on
skip_loading_screen = off
loading_screen_min_ms = 1000
fix_model_draw_order = on
spin_ledge_jump = on
speed_display = off
spin_display = off

# saving: the game's own save and load screens, saving to files in memory_card/
memory_card = off

# replays
replay_inputs = off
replay_speed = 1

# the level, built to build/levels/, that CUSTOM LEVEL on the title screen starts (see doc/custom_levels.md):
# boot_level = 1_tide_ruins
