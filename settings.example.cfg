# c1 settings (example)
#
# The launcher (build/launcher.exe) creates settings.cfg from this file and
# changes it in its Settings tab. The values below are the defaults. See doc/settings.md for what each
# setting does and the values it takes.

loading_screen = on
loading_screen_min_ms = 2000
speed_display = off
fps_display = off
spin_display = off
skip_splash_screens = off
fix_model_draw_order = off
replay_inputs = off
replay_speed = 1
frame_rate = 60

# to boot straight into a level built to build/levels/ (see doc/custom_levels.md):
# boot_level = tide_ruins
