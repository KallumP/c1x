# c1 settings (example)
#
# The launcher (build/_launcher.exe) creates settings.cfg from this file and
# changes it in its Settings tab. The values below are the defaults. See doc/settings.md for what each
# setting does and the values it takes.

skip_loading_screen = off
loading_screen_min_ms = 1000
speed_display = off
fps_display = on
spin_display = off
box_display = on
skip_splash_screens = on
fix_model_draw_order = on
spin_ledge_jump = on
replay_inputs = off
replay_speed = 1
frame_rate = 60
fullscreen = off

# to boot straight into a level built to build/levels/ (see doc/custom_levels.md):
# boot_level = 1_tide_ruins
